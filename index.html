*{box-sizing:border-box} body{margin:0;min-height:100vh;font-family:Arial,sans-serif;color:#fff;background:radial-gradient(circle at 50% 20%,#18210d 0,#0c100d 30%,#050607 72%);overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:85px 85px;opacity:.18;pointer-events:none}
.wrap{max-width:720px;margin:auto;padding:42px 22px 35px;text-align:center}.badge{display:inline-flex;align-items:center;gap:10px;padding:12px 24px;border:1px solid #59615a;border-radius:30px;background:#151817;box-shadow:0 0 25px #9cff0030;font-weight:700;letter-spacing:1px}.dot{width:10px;height:10px;border-radius:50%;background:#32e06f;box-shadow:0 0 12px #32e06f}
.logo{width:min(290px,72vw);height:min(290px,72vw);object-fit:cover;border-radius:50%;margin:35px auto 28px;display:block;border:5px solid #777;box-shadow:0 0 45px #9cff0060}
h1{font-size:clamp(30px,7vw,58px);margin:10px 0 14px;font-weight:900;letter-spacing:1px;text-transform:uppercase} h1 span{color:#b8ff3d}.sub{font-size:clamp(18px,4.5vw,27px);line-height:1.45;color:#d5d7d8;margin:0 auto 34px}
.btn{display:block;text-decoration:none;color:#fff;font-size:clamp(24px,6vw,34px);font-weight:900;letter-spacing:1px;padding:25px 20px;border:1px solid #666;border-radius:24px;background:linear-gradient(145deg,#222522,#121413);box-shadow:0 0 28px #b6ff0020;margin:22px 0}.btn:active{transform:scale(.98)}
.timerbox{padding:28px 20px;border:1px solid #333;border-radius:28px;background:#151817}.label{color:#aeb7c7;font-weight:800;letter-spacing:3px;font-size:15px}.timer{font-size:54px;font-weight:900;margin:10px 0}.small{font-size:18px;color:#c8c9ca;line-height:1.5}
.stats{display:flex;justify-content:center;gap:0;margin:45px 0 65px}.stat{flex:1;padding:0 14px;border-right:1px solid #333}.stat:last-child{border:0}.num{font-size:30px;font-weight:900}.cap{color:#999;margin-top:8px;font-size:14px;letter-spacing:1px}
footer{color:#888;line-height:1.8;font-size:15px} footer b{color:#aaa}
</style>
