<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leak Paper</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Consolas, monospace;
}

body{
    background:#000;
    color:#00ff41;
    overflow:hidden;
}

/* Matrix Background */
canvas{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:-1;
}

.center{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.login-box{
    background:rgba(0,0,0,0.8);
    border:2px solid #00ff41;
    box-shadow:0 0 20px #00ff41;
    padding:40px;
    text-align:center;
    border-radius:15px;
    width:350px;
}

.title{
    font-size:32px;
    margin-bottom:20px;
    text-shadow:0 0 15px #00ff41;
    animation:glow 1.5s infinite alternate;
}

@keyframes glow{
    from{ text-shadow:0 0 10px #00ff41; }
    to{ text-shadow:0 0 30px #00ff41; }
}

.typing{
    overflow:hidden;
    white-space:nowrap;
    border-right:3px solid #00ff41;
    width:0;
    margin:auto;
    animation:typing 4s steps(30,end) forwards,
              blink .8s infinite;
}

@keyframes typing{
    from{width:0}
    to{width:100%}
}

@keyframes blink{
    50%{border-color:transparent}
}

input{
    width:100%;
    padding:12px;
    margin-top:20px;
    background:#111;
    border:1px solid #00ff41;
    color:#00ff41;
    outline:none;
}

button{
    width:100%;
    margin-top:15px;
    padding:12px;
    background:#00ff41;
    color:#000;
    border:none;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    box-shadow:0 0 20px #00ff41;
}

#error{
    color:red;
    margin-top:10px;
}

#content{
    display:none;
    text-align:center;
    padding-top:100px;
}

.big{
    font-size:50px;
    text-shadow:0 0 20px #00ff41;
}

.subtitle{
    margin-top:20px;
    font-size:20px;
}
</style>
</head>
<body>

<canvas id="matrix"></canvas>

<div id="login" class="center">
    <div class="login-box">
        <h1 class="title">𝗟𝗘𝗔𝗞 𝗣𝗔𝗣𝗘𝗥</h1>

        <p class="typing">ACCESS - ENTER PASSWORD</p>

        <input type="password" id="password" placeholder="Enter Password">
        <button onclick="unlock()">𝗘𝗡𝗧𝗘𝗥</button>

        <p id="error"></p>
    </div>
</div>

<div id="content">
    <h1 class="big">ACCESS GRANTED</h1>
    <p class="subtitle">Welcome to Leak Paper</p>
    <br>
    <p>System Connected...</p>
</div>

<script>
// Password System
function unlock(){
    const pass = document.getElementById("password").value;

    if(pass === "mafiyaleaker@091"){
        document.getElementById("login").style.display="none";
        document.getElementById("content").style.display="block";
    }else{
        document.getElementById("error").innerText="ACCESS DENIED!";
    }
}

// Matrix Animation
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const chars = "01ABCDEFGHIJKLMNOPQRSTUVWXYZ#$%^&*";
const fontSize = 16;
const columns = canvas.width / fontSize;

const drops = [];

for(let i=0;i<columns;i++){
    drops[i]=1;
}

function draw(){
    ctx.fillStyle="rgba(0,0,0,0.05)";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle="#00ff41";
    ctx.font=fontSize+"px monospace";

    for(let i=0;i<drops.length;i++){
        const text=chars[Math.floor(Math.random()*chars.length)];

        ctx.fillText(text,i*fontSize,drops[i]*fontSize);

        if(drops[i]*fontSize > canvas.height && Math.random()>0.975){
            drops[i]=0;
        }

        drops[i]++;
    }
}

setInterval(draw,35);
</script>

</body>
</html>
